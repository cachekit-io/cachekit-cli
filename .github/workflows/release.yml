name: Release

# Every push to main runs release-please, which keeps a release PR open with
# the next version and changelog. Merging that PR creates the tag and GitHub
# Release, and the jobs below then attach attested binaries and publish the
# crate to crates.io. A pushed tag releases nothing: tags the App creates do
# not trigger workflows, so the whole release runs in this one workflow.
# Users verify a binary against this file's path and refs/heads/main, so
# renaming the file or changing the trigger breaks the README's verify command.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The App token, not GITHUB_TOKEN, opens the release PR, so CI runs on it.
      - uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Only what release-please and the assignee step use.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Assign the release PR to the maintainer
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          # Via env: the PR JSON carries branch and title text.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: gh pr edit "$(jq -er .number <<< "$PR_JSON")" --add-assignee 27Bslash6

  check:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the crate version $version"
            exit 1
          fi

      - name: Package the crate
        # Builds the packaged crate, so the publish job can skip that build.
        run: cargo package --locked

  build:
    name: build (${{ matrix.target }})
    needs: [release-please, check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # musl builds are static, so they run on any Linux distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        # ring compiles C, which needs musl-gcc.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Add the target
        run: rustup target add "$TARGET"

      - name: Test the shipped target
        run: cargo test --locked --release --target "$TARGET"

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Archive
        run: |
          dir="ck-$TAG-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/ck" LICENSE README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ck-*.tar.gz
          if-no-files-found: error

  release:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Signing happens here rather than in the build jobs, so dependency build
    # scripts never run with a token that can sign or publish.
    permissions:
      contents: write # upload to the release
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Unpack the binaries
        # Attesting the binary too lets a user verify ck after unpacking it.
        run: for archive in dist/*.tar.gz; do tar -xzf "$archive" -C dist; done

      - name: Attest the archives and the binaries in them
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/ck-*/ck

      - name: Upload to the GitHub Release
        # release-please created the release. --clobber lets a rerun replace
        # the archives with its own attested ones.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" --clobber dist/*.tar.gz

  publish:
    needs: [release-please, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # crates.io accepts a token minted here only from this workflow in this
    # environment: trusted publishing, so the repo holds no registry secret.
    environment: release
    permissions:
      contents: read
      id-token: write # exchange for a crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # Needs the crate to exist on crates.io with this workflow and the
      # `release` environment registered as its trusted publisher. crates.io
      # attaches a publisher only to an existing crate, so 0.0.0 is published
      # by hand with an API token first. Every released version comes after it,
      # because this job cannot publish a version that already exists.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        # The check job already built the packaged crate. A version can never
        # be republished, so this runs last, after the GitHub Release exists.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
