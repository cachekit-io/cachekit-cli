# Dependencies come from crates.io and nowhere else. CI adds the two checks
# cargo-deny cannot make: committed Cargo configs and versioned path deps.

[licenses]
# Permissive licences only, each one carried by the real dependency graph.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0"]
# webpki-roots is the Mozilla root-certificate bundle that the SaaS backend's
# TLS client trusts. It is data, not code, under a permissive data licence.
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
wildcards = "deny"
# ck has no HTTP client of its own: every network call goes through
# cachekit-rs, whose request paths are fixed. A direct HTTP client
# dependency fails here.
#
# ck derives its cache-key hash key from cachekit-core and encrypts through
# cachekit-rs's EncryptionLayer. Two cachekit-core versions would let those
# drift apart and still build.
deny = [
    { crate = "reqwest", wrappers = ["cachekit-rs"] },
    { crate = "cachekit-core", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
